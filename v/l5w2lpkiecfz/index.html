<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- unlisted: reachable by link only, kept out of search engines -->
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="googlebot" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Videos</title>
  <style>
    :root { --bg: hsl(220 14% 96.5%); --fg: hsl(220 20% 10%); --muted: hsl(220 10% 46%); --border: hsl(220 14% 90%); }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font-family: Georgia, 'Times New Roman', serif; }
    main { max-width: 1120px; margin: 0 auto; padding: 40px 16px 64px; }
    section + section { margin-top: 56px; }
    video { display: block; width: 100%; height: auto; border-radius: 16px; border: 1.5px solid var(--border); background: #fff; }
    h1 { font-weight: 700; font-size: 22px; line-height: 1.3; margin: 16px 0 4px; }
    p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.5; }
  </style>
</head>
<body>
  <main>
    <section>
      <video src="spiegel-eye.mp4" controls controlslist="nodownload" preload="metadata" playsinline></video>
      <h1>Spiegel Eye</h1>
      <p>Noise, Signal, These, Kontakt · 1:43 · Entwurf</p>
    </section>
    <section>
      <video src="fundops-teaser.mp4" controls controlslist="nodownload" preload="metadata" playsinline></video>
      <h1>Wholegrain &amp; FundOps</h1>
      <p>Von Belegen zum Abschluss · 1:33 · Entwurf</p>
    </section>
  </main>
</body>
</html>
